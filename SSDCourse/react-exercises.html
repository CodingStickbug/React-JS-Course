<!doctype html>
<html>
  <head>
    <title>Exercises</title>
  </head>

  <body>
    <div class="js-container"></div>

    <script src="react-basics.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ProductDetails({ name, price, discountPrice }) {
        return (
          <>
            {name === "Cotton Socks" && (
              <img
                src="https://supersimple.dev/images/cotton-socks.png"
                width="50"
              />
            )}
            {name === "Tennis Balls" && (
              <img
                src="https://supersimple.dev/images/tennis-balls.png"
                width="50"
              />
            )}
            {name === "T-Shirt" && (
              <img
                src="https://supersimple.dev/images/plain-t-shirt.png"
                width="50"
              />
            )}
            <p>{name}</p>
            {discountPrice != null ? (
              <del>
                <p>Price: {price}</p>
              </del>
            ) : (
              <p>Price: {price}</p>
            )}
            {discountPrice != null && <p>Discount Price: {discountPrice}</p>}
            <div>
              <button>Add to Cart</button>
            </div>
          </>
        );
      }

      function App() {
        return (
          <>
            <ProductDetails
              name="Cotton Socks"
              price="$10.90"
              discountPrice="$5.45"
            />
            <ProductDetails name="Tennis Balls" price="$6.00" />
            <ProductDetails name="T-Shirt" price="$7.99" />
          </>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
