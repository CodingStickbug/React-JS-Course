<!doctype html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 0px;
      }
      .send-button {
        background-color: orange;
        padding: 7px 10px;
        margin-left: 10px;
        border: 1px solid black;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
        height: 35px;
      }
      .chat-input {
        border: 1px solid black;
        padding: 10px;
        border-radius: 5px;
        font-size: 10;
        flex-grow: 1;
        margin-bottom: 40px;
      }
      .chat-input-container {
        display: flex;
        padding-left: 50px;
        padding-right: 50px;
      }
      .main-app {
        height: 100vh;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        display: flex;
        flex-direction: column;
      }
      .user-container {
        align-items: start;
        display: flex;
        justify-content: right;
      }
      .clanker-container {
        align-items: start;
        display: flex;
      }
      .message-text-box {
        margin-left: 5px;
        margin-right: 5px;
        margin-bottom: 5px;
        background-color: rgba(202, 140, 25, 0.223);
        padding: 10px 10px;
        border-radius: 5px;
        max-width: 300px;
      }
      .profile-image {
        width: 35px;
      }
      .chat-messages-container {
        margin-top: 20px;
        flex-grow: 1;
        overflow: scroll;
        scrollbar-width: none;
      }
      .welcome-text {
        margin: 10px;
        text-align: center;
        color: grey;
      }
      .loading-spinner {
        width: 20px;
      }
    </style>
  </head>

  <body>
    <div class="js-container"></div>

    <script src="react-basics.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput({ setChatMessages, chatMessages }) {
        const [inputText, setInputText] = React.useState("");
        const [loading, setLoading] = React.useState(false);
        function SaveInputText(event) {
          setInputText(event.target.value);
        }

        async function SendMessage() {
          if (loading || inputText === "") {
            return;
          } else {
            setLoading(true);
            const newChatMessages = [
              ...chatMessages,
              {
                message: inputText,
                sender: "user",
                id: crypto.randomUUID(),
              },
            ];
            setChatMessages(newChatMessages);
            setInputText("");

            setChatMessages([
              ...newChatMessages,
              {
                message: (
                  <img
                    src="https://supersimple.dev/images/loading-spinner.gif"
                    className="loading-spinner"
                  />
                ),
                sender: "clanker",
                id: crypto.randomUUID(),
              },
            ]);
            const response = await Chatbot.getResponseAsync(inputText);
            setChatMessages([
              ...newChatMessages,
              {
                message: response,
                sender: "clanker",
                id: crypto.randomUUID(),
              },
            ]);
          }
          setLoading(false);
        }
        function InputSubmitted(events) {
          if (events.key == "Enter" && !loading) {
            SendMessage();
          } else if (events.key == "Escape") {
            setInputText("");
          }
        }
        return (
          <div className="chat-input-container">
            <input
              className="chat-input"
              onKeyDown={InputSubmitted}
              value={inputText}
              placeholder="Message a Clanker"
              size="30"
              onChange={SaveInputText}
            />
            <button className="send-button" onClick={SendMessage}>
              Send
            </button>
          </div>
        );
      }

      function ChatMessage({ message, sender }) {
        //const { message, sender } = props;
        return (
          <div
            className={
              sender === "clanker" ? "clanker-container" : "user-container"
            }
          >
            {sender === "clanker" && (
              <img src={"robot.png"} className="profile-image" />
            )}
            <text class="message-text-box">{message}</text>
            {sender === "user" && (
              <img src={"user.png"} className="profile-image" />
            )}
          </div>
        );
        // My implementation (Before he showed)
        /*return sender === "user" ? (
          <div>
            {message}
            <img src={"user.png"} width="35" />
          </div>
        ) : (
          <div>
            <img src={"robot.png"} width="35" />
            {message}
          </div>
        );*/
      }

      function ChatMessages({ chatMessages }) {
        //  const [chatMessages, setChatMessages] = array;
        const chatMessagesRef = React.useRef(null);
        useAutoScroll();
        function useAutoScroll(dependancies) {
          React.useEffect(() => {
            const containerElem = chatMessagesRef.current;
            if (containerElem) {
              containerElem.scrollTop = containerElem.scrollHeight;
            }
          }, dependancies);
          return chatMessagesRef;
        }
        return (
          <div className="chat-messages-container" ref={chatMessagesRef}>
            {" "}
            {chatMessages.map((message) => {
              return (
                <ChatMessage
                  message={message.message}
                  sender={message.sender}
                  key={message.id}
                />
              );
            })}{" "}
          </div>
        );
      }

      function App() {
        const inputAbove = false;
        const [chatMessages, setChatMessages] = React.useState([]);
        return (
          <div className="main-app">
            {inputAbove && (
              <ChatInput
                chatMessages={chatMessages}
                setChatMessages={setChatMessages}
              />
            )}
            {chatMessages.length === 0 && (
              <div className="welcome-text">
                Welcome to the Chat-Bot project! Send a message to get started
              </div>
            )}
            <ChatMessages chatMessages={chatMessages} />
            {!inputAbove && (
              <ChatInput
                chatMessages={chatMessages}
                setChatMessages={setChatMessages}
              />
            )}
          </div>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
